---
name: towonel
services:
  towonel-hub:
    # renovate: datasource=docker depName=codeberg.org/towonel/towonel-node
    image: codeberg.org/towonel/towonel-node:1.13.2@sha256:3332f2babea99f5ea57c40e2e64fff354fe49fe75f0a8cabe94b9cabb05cab34
    container_name: towonel-hub
    user: "10001:10001"
    environment:
      RUST_LOG: info
      TOWONEL_INVITE_HASH_KEY: ${TOWONEL_INVITE_HASH_KEY}
      TOWONEL_HUB_ENABLED: "true"
      TOWONEL_HUB_ALLOW_PRIVILEGED_PORTS: "true"
      TOWONEL_HUB_PUBLIC_URL: https://towonel.eudald.gr
      TOWONEL_HUB_OPERATOR_API_KEY_PATH: /data/operator.key
      # Behind a reverse proxy on :443 — these stay non-default:
      TOWONEL_EDGE_ENABLED: "true"
      TOWONEL_EDGE_HEALTH_LISTEN_ADDR: 0.0.0.0:9092
      TOWONEL_EDGE_IROH_PORT: "51820"
      TOWONEL_EDGE_LISTEN_ADDR: 0.0.0.0:4443
      TOWONEL_EDGE_PROXY_PROTOCOL: "true"
    expose:
      - "4443"
      - "8443"
    ports:
      - "22:22"
      - "6690:6690"
      - "25565:25565" # Minecraft Java → mc-router
      - "19132:19132/udp" # Minecraft Bedrock (fc)
      - "51820:51820/udp"
    volumes:
      - /opt/towonel:/data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-fsS"
        - "-o"
        - "/dev/null"
        - "http://127.0.0.1:8443/v1/health"
      interval: 30s
      timeout: 5s
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
    restart: unless-stopped
networks:
  default:
    name: edge
    external: true
