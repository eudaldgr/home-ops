---
- name: Bootstrap Cadi
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: auto_silent
    host_ssh_port: 22222
    ansible_port: "{{ bootstrap_ssh_port | default(22) }}"
    blocked_countries:
      - IL
      - KP

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping:

    - name: Set hostname
      tags:
        - bootstrap
      ansible.builtin.hostname:
        name: cadi

    - name: Fetch bootstrap secrets from 1Password
      tags:
        - always
      ansible.builtin.shell: "op read 'op://{{ item.key }}' < /dev/null"
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      no_log: true
      loop:
        - { key: docker/cadi/DOCOCD_OP_TOKEN, var: dococd_op_token }
        - { key: docker/cadi/DOCOCD_API_SECRET, var: dococd_api_secret }
        - { key: docker/cadi/DOCOCD_WEBHOOK_SECRET, var: dococd_webhook_secret }
        - { key: docker/cadi/CROWDSEC_API_KEY, var: crowdsec_api_key }
      register: secrets_raw
      loop_control:
        label: "{{ item.key }}"

    - name: Set secret facts
      tags:
        - always
      ansible.builtin.set_fact:
        "{{ item.item.var }}": "{{ item.stdout }}"
      loop: "{{ secrets_raw.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      no_log: true

    - name: Validate required secrets
      ansible.builtin.fail:
        msg: "Required secret '{{ item.item.key }}' is empty in 1Password"
      when: item.stdout == ""
      loop: "{{ secrets_raw.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      no_log: true

    - name: packages
      tags:
        - packages
      block:
        - name: packages | Install Docker
          ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
          args:
            executable: /bin/bash
            creates: /usr/bin/docker

        - name: packages | Install ufw
          ansible.builtin.apt:
            name: ufw
            state: present
            update_cache: false

        - name: packages | Install ipset
          ansible.builtin.apt:
            name: ipset
            state: present
            update_cache: false

    - name: ssh
      tags:
        - ssh
      block:
        - name: ssh | Harden sshd_config
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/01-hardening.conf
            content: |
              Port {{ host_ssh_port }}
              PermitRootLogin no
              PasswordAuthentication no
              MaxAuthTries 3
              LoginGraceTime 20
            owner: root
            group: root
            mode: "0644"
            validate: /usr/sbin/sshd -t -f %s
          register: ssh_config
          changed_when: ssh_config.changed or (ansible_port | int != host_ssh_port | int)
          notify:
            - Reload systemd daemon
            - Restart SSH listener

        - name: ssh | Apply changes before deploying Towonel
          ansible.builtin.meta: flush_handlers

        - name: ssh | Use management port
          ansible.builtin.set_fact:
            ansible_port: "{{ host_ssh_port }}"

        - name: ssh | Reconnect on management port
          ansible.builtin.meta: reset_connection

        - name: ssh | Wait for management connection
          ansible.builtin.wait_for_connection:
            timeout: 60

    - name: firewall
      tags:
        - firewall
      block:
        - name: firewall | Allow ports
          community.general.ufw:
            rule: allow
            port: "{{ item.port }}"
            proto: "{{ item.protocol | default('tcp') }}"
          loop:
            - name: SSH
              port: 22
            - name: Host SSH
              port: "{{ host_ssh_port }}"
            - name: HTTP
              port: 80
            - name: HTTPS
              port: 443
            - name: Synology Drive
              port: 6690
            - name: Minecraft Java
              port: 25565
            - name: Minecraft Bedrock (fc)
              port: 19132
              protocol: udp
            - name: towonel-iroh
              port: 51820
              protocol: udp

        - name: firewall | Enable UFW
          community.general.ufw:
            state: enabled
            policy: deny

    - name: docker
      tags:
        - docker
      block:
        - name: docker | Create edge docker network
          community.docker.docker_network:
            name: edge
            driver: bridge
            state: present

    - name: towonel
      tags:
        - towonel
      vars:
        towonel_config_dir: /opt/towonel
      block:
        - name: towonel | Create directory
          ansible.builtin.file:
            path: "{{ towonel_config_dir }}"
            state: directory
            owner: 10001
            group: 10001
            mode: "0755"

    - name: doco-cd
      tags:
        - doco-cd
      vars:
        dococd_config_dir: /opt/doco-cd
      block:
        - name: doco-cd | Create directory
          ansible.builtin.file:
            path: "{{ dococd_config_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: doco-cd | Copy bootstrap compose file
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../docker/cadi/doco-cd/compose.main.yaml"
            dest: "{{ dococd_config_dir }}/compose.yaml"
            owner: root
            group: root
            mode: "0644"
          register: compose_file

        - name: doco-cd | Create secrets
          ansible.builtin.copy:
            dest: "{{ dococd_config_dir }}/{{ item.name }}"
            content: |
              {{ item.content }}
            owner: root
            group: root
            mode: "0600"
          no_log: true
          loop:
            - name: 1pw_token
              content: "{{ dococd_op_token }}"
            - name: api_secret
              content: "{{ dococd_api_secret }}"
            - name: webhook_secret
              content: "{{ dococd_webhook_secret }}"

        - name: doco-cd | Run docker-compose
          community.docker.docker_compose_v2:
            project_src: "{{ dococd_config_dir }}"
            files:
              - compose.yaml
            pull: always
            state: present
          when: not ansible_check_mode

        - name: doco-cd | Wait for healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

    - name: crowdsec
      tags:
        - crowdsec
      block:
        - name: crowdsec | Wait for LAPI on loopback
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 8088
            timeout: 180

        - name: crowdsec | Register firewall bouncer (idempotent)
          ansible.builtin.shell: |
            set -e
            if docker exec crowdsec cscli bouncers list -o json | jq -e '.[] | select(.name=="firewall")' >/dev/null; then
              echo "ALREADY_REGISTERED"
            else
              docker exec crowdsec cscli bouncers add firewall --key "{{ crowdsec_api_key }}"
            fi
          register: bouncer_reg
          changed_when: "'ALREADY_REGISTERED' not in bouncer_reg.stdout"

        - name: crowdsec | Register CAPI (community blocklist)
          ansible.builtin.shell: |
            docker exec crowdsec cscli capi status >/dev/null 2>&1 \
              || docker exec crowdsec cscli capi register
          register: capi_reg
          changed_when: "'Successfully' in capi_reg.stdout"

        - name: crowdsec | Ensure /etc/apt/keyrings exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: crowdsec | Download apt signing key
          ansible.builtin.get_url:
            url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
            dest: /etc/apt/keyrings/crowdsec.asc
            mode: "0644"

        - name: crowdsec | Add apt repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/crowdsec.asc] https://packagecloud.io/crowdsec/crowdsec/any any main"
            filename: crowdsec
            state: present
            update_cache: true

        - name: crowdsec | Install host firewall bouncer
          ansible.builtin.apt:
            name: crowdsec-firewall-bouncer-iptables
            state: present

        - name: crowdsec | Render bouncer config
          ansible.builtin.template:
            src: crowdsec-firewall-bouncer.yaml.j2
            dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
            owner: root
            group: root
            mode: "0600"
          notify: Restart crowdsec-firewall-bouncer

        - name: crowdsec | Enable + start bouncer
          ansible.builtin.systemd:
            name: crowdsec-firewall-bouncer
            enabled: true
            state: started

        - name: crowdsec | Verify bouncer is active
          ansible.builtin.command: systemctl is-active crowdsec-firewall-bouncer
          changed_when: false

    - name: geo-block
      tags:
        - geo-block
      block:
        - name: geo-block | Create directory
          ansible.builtin.file:
            path: /opt/geo-block
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: geo-block | Render update script
          ansible.builtin.template:
            src: update-country-blocks.sh.j2
            dest: /opt/geo-block/update-country-blocks.sh
            owner: root
            group: root
            mode: "0755"

        - name: geo-block | Run initial block update
          ansible.builtin.shell:
            cmd: /opt/geo-block/update-country-blocks.sh "{{ blocked_countries | join(' ') }}"
            creates: /opt/geo-block/zones

        - name: geo-block | Create weekly cron job
          ansible.builtin.cron:
            name: "GeoIP country block weekly refresh"
            minute: "0"
            hour: "3"
            day: "*"
            month: "*"
            weekday: "0"
            job: "/opt/geo-block/update-country-blocks.sh {{ blocked_countries | join(' ') | quote }} >> /var/log/geo-block.log 2>&1"
            state: present

        - name: geo-block | Create reboot cron job
          ansible.builtin.cron:
            name: "GeoIP country block restore on reboot"
            special_time: reboot
            job: "/opt/geo-block/update-country-blocks.sh {{ blocked_countries | join(' ') | quote }} >> /var/log/geo-block.log 2>&1"
            state: present

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart SSH listener
      ansible.builtin.shell: |
        systemctl stop ssh.service ssh.socket
        systemctl start ssh.socket ssh.service

    - name: Restart crowdsec-firewall-bouncer
      ansible.builtin.service:
        name: crowdsec-firewall-bouncer
        state: restarted
