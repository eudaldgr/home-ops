---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-postgres-objectstore
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ${APP}-postgres-objectstore-secret
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        AWS_REGION: ${CNPG_REGION:=eu-south-0}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: cnpg
        property: username
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg
        property: password
