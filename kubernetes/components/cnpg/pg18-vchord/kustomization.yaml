---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Add after ../pg18: switches to the standard image (minimal lacks pgvector) and loads VectorChord from its own image. The extensions themselves are created by the app's Database resource.
patches:
  - target:
      kind: Cluster
    patch: |
      - op: replace
        path: /spec/imageName
        value: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
      - op: add
        path: /spec/postgresql/shared_preload_libraries
        value: ["vchord"]
      - op: add
        path: /spec/postgresql/extensions
        value:
          - name: vchord
            image:
              reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
            dynamic_library_path: ["/usr/lib/postgresql/18/lib/"]
            extension_control_path: ["/usr/share/postgresql/18/"]
