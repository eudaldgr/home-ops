---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  # Same identity as the SnapshotPolicy mover: a non-root restore writes files as the mover UID
  mover:
    securityContext:
      runAsUser: ${KOPIUR_PUID:=65532}
      runAsGroup: ${KOPIUR_PGID:=65532}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  target:
    populator: {}
