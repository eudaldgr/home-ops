---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: configarr-configmap
    files:
      - config.yml=./resources/config.yml
      - radarr.yml=./resources/templates/radarr.yml
      - sonarr.yml=./resources/templates/sonarr.yml
      - radarr-catalan.json=./resources/cfs/radarr-catalan.json
      - radarr-spanish.json=./resources/cfs/radarr-spanish.json
generatorOptions:
  disableNameSuffixHash: true
