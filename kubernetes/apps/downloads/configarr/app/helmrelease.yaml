---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: configarr
spec:
  chartRef:
    kind: OCIRepository
    name: configarr
  interval: 1h
  values:
    controllers:
      configarr:
        type: cronjob
        cronjob:
          schedule: 0 0 * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/eudaldgr-labs/configarr
              tag: 1.38.0-r0@sha256:9db7362b38f24b0c2f01adc780b7f4bf48776fb43088df5b519045a4f70652ea
            env:
              TZ: Europe/Madrid
            envFrom:
              - secretRef:
                  name: configarr-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        items:
          - key: config.yml
            path: config.yml
          - key: radarr.yml
            path: templates/radarr.yml
          - key: sonarr.yml
            path: templates/sonarr.yml
          - key: radarr-catalan.json
            path: cfs/radarr-catalan.json
          - key: radarr-spanish.json
            path: cfs/radarr-spanish.json
        globalMounts:
          - path: /configarr/etc
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /configarr/var
      run:
        type: emptyDir
        globalMounts:
          - path: /configarr/run
      tmp:
        type: emptyDir
