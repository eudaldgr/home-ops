---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: admins
spec:
  name: admins
  friendlyName: Admins
  users:
    usernames:
      - admin
  customClaims:
    - key: immich_role
      value: admin
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: home-ops
spec:
  name: home-ops
  friendlyName: Home Ops
  users:
    usernames:
      - eudaldgr
  allowedOIDCClients:
    - name: autobrr
      namespace: downloads
    - name: lidarr
      namespace: downloads
    - name: prowlarr
      namespace: downloads
    - name: qui
      namespace: downloads
    - name: radarr
      namespace: downloads
    - name: sonarr
      namespace: downloads
    - name: torrent
      namespace: downloads
    - name: grafana
      namespace: o11y
    - name: mc-register
      namespace: games
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: family
spec:
  name: family
  friendlyName: Family
  users:
    usernames:
      - eudaldgr
  allowedOIDCClients:
    - name: actual
      namespace: default
    - name: memos
      namespace: default
    - name: hass
      namespace: home-automation
    - name: immich
      namespace: immich
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: relatives
spec:
  name: relatives
  friendlyName: Relatives
  allowedOIDCClients:
    - name: immich
      namespace: immich
  customClaims:
    - key: immich_quota
      value: "128"
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: friends
spec:
  name: friends
  friendlyName: Friends
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: users
spec:
  name: users
  friendlyName: Users
