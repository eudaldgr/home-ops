---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-operator
spec:
  chart:
    spec:
      chart: secrets-operator
      version: 0.11.12
      sourceRef:
        kind: HelmRepository
        name: infisical
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      retries: 3
  rollback:
    cleanupOnFail: true
  values:
    hostAPI: https://eu.infisical.com/api
    installCRDs: true
    controllerManager:
      replicas: 1
      manager:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
