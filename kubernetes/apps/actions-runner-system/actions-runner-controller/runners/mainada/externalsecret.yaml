---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mainada-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mainada-runner-secret
    template:
      data:
        github_app_id: "{{ .MAINADA_RUNNER_APP_ID }}"
        github_app_installation_id: "{{ .MAINADA_RUNNER_INSTALLATION_ID }}"
        github_app_private_key: "{{ .MAINADA_RUNNER_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: mainada-runner
