---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reactive-resume
spec:
  chartRef:
    kind: OCIRepository
    name: reactive-resume
  interval: 1h
  values:
    controllers:
      reactive-resume:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/reactive-resume/reactive-resume
              tag: v6.0.10@sha256:74f710181ecada7f215b1c52de5c61941ece61818c26a7d103fc0c010fb49a8c
            env:
              TZ: Europe/Madrid
              APP_URL: https://resume.eudald.gr
              PORT: &port 3000
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres-app"
                    key: uri
              # Envoy pods; lets the per-IP rate limiter see the real client instead of envoy
              TRUSTED_PROXIES: 10.42.0.0/16
              # Pocket ID only; who gets in is decided by the client's allowed groups
              FLAG_DISABLE_EMAIL_AUTH: true
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_DISCOVERY_URL: https://auth.eudald.gr/.well-known/openid-configuration
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: resume-oidc
                    key: client-id
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: resume-oidc
                    key: client-secret
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  # /api/health includes a storage check with a 5s deadline
                  timeoutSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # The image drops to `node` itself when started as root; running as 1000 skips that
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - resume.eudald.gr
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
