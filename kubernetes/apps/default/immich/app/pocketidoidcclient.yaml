---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
spec:
  launchUrl: https://immich.eudald.gr
  callbackUrls:
    - https://immich.eudald.gr/auth/login
    - https://immich.eudald.gr/user-settings
    - app.immich:///oauth-callback
  logoutCallbackUrls:
    - https://immich.eudald.gr
  skipConsent: true
  pkceEnabled: true
  logo:
    nameOverride: immich
  allowedUserGroups:
    - name: admins
      namespace: auth
  secret:
    name: immich-oidc
    keys:
      clientID: client-id
      clientSecret: client-secret
