---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      immich:
        forceRename: immich
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: immich
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
            env:
              TZ: Europe/Madrid
              IMMICH_PORT: &port 2283
              IMMICH_MEDIA_LOCATION: /data
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              REDIS_HOSTNAME: immich-dragonfly
              DB_HOSTNAME: immich-postgres
              DB_USERNAME: &dbUser immich
              DB_DATABASE_NAME: &dbName immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: &secret "{{ .Release.Name }}-secret"
                    key: DB_PASSWORD
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
      machine-learning:
        strategy: Recreate
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: immich
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.1-openvino@sha256:9f5ea923b763435592280e2f5e051a62f1a33d6d14e87620fc15453c27a12ae0
            env:
              TZ: Europe/Madrid
              MACHINE_LEARNING_MODEL_TTL: 0
            probes:
              liveness: &mlProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *mlProbes
            securityContext: *securityContext
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
      postgres:
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/postgres
              tag: 16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
            env:
              PGDATA: /var/lib/postgresql/data/pgdata
              POSTGRES_USER: *dbUser
              POSTGRES_DB: *dbName
              POSTGRES_INITDB_ARGS: --data-checksums
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: DB_PASSWORD
            probes:
              liveness: &pgProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "immich", "-d", "immich"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *pgProbes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      immich:
        controller: immich
        primary: true
        ports:
          http:
            port: 80
            targetPort: *port
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.eudald.gr"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: immich
                port: 80
    persistence:
      library:
        type: nfs
        server: ds920plus.lan.eudald.gr
        path: /volume1/kubernetes/immich
        advancedMounts:
          immich:
            app:
              - path: /data
      postgres:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          postgres:
            app:
              - path: /var/lib/postgresql/data
      postgres-conf:
        type: emptyDir
        advancedMounts:
          postgres:
            app:
              - path: /etc/postgresql
                subPath: conf
              - path: /var/run/postgresql
                subPath: run
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        advancedMounts:
          postgres:
            app:
              - path: /dev/shm
      cache:
        type: emptyDir
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
      immich-cache:
        type: emptyDir
        advancedMounts:
          immich:
            app:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
