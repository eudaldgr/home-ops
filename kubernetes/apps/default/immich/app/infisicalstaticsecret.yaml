---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: immich
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-system
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /kubernetes/default/immich
      recursive: false
  targets:
    - name: immich-secret
      namespace: default
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          DB_PASSWORD: "{{ .DB_PASSWORD.Value }}"
