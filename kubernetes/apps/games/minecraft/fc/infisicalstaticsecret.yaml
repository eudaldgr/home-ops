---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: minecraft-fc
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-system
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /kubernetes/games/minecraft/fc
      recursive: false
  targets:
    - name: minecraft-fc-secret
      namespace: games
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          RCON_PASSWORD: "{{ .RCON_PASSWORD.Value }}"
