---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-fc
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft-fc
  interval: 1h
  values:
    controllers:
      minecraft:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: 2026.9.2-java25@sha256:de5d1b1a83eba576f6c8a688fac2a3523ce457724cdebc8ea48d7818b74cdf6e
            env:
              TZ: Europe/Madrid
              EULA: "TRUE"
              TYPE: PAPER
              VERSION: 26.2
              MEMORY: 4G
              USE_AIKAR_FLAGS: true
              # Each world listens Bedrock on its own UDP port of the shared LoadBalancer IP
              JVM_OPTS: -DGeyser.PrintSecureChatInformation=false -DgeyserUdpPort=19132
              SERVER_NAME: fc
              MOTD: Survival • Java & Bedrock
              MODE: survival
              DIFFICULTY: normal
              ONLINE_MODE: false
              OPS: 40c7bf28-61ce-3b6c-a03d-7a0571f708c9
              ENABLE_WHITELIST: false
              ENFORCE_WHITELIST: false
              ENFORCE_SECURE_PROFILE: false
              MAX_PLAYERS: 10
              PVP: true
              SPAWN_PROTECTION: 10
              VIEW_DISTANCE: 16
              SIMULATION_DISTANCE: 10
              PLAYER_IDLE_TIMEOUT: 30
              ENABLE_STATUS: true
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: minecraft-fc-secret
                    key: RCON_PASSWORD
              # Plugin/Paper configs from git (/plugins, /config) always win over the copies in /data
              SYNC_SKIP_NEWER_IN_DESTINATION: false
              PLUGINS: |-
                https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
                https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
                https://ci.ender.zone/job/EssentialsX/1832/artifact/jars/EssentialsX-2.22.1-dev+27-e70bdb8.jar
                https://ci.ender.zone/job/EssentialsX/1832/artifact/jars/EssentialsXChat-2.22.1-dev+27-e70bdb8.jar
                https://ci.ender.zone/job/EssentialsX/1832/artifact/jars/EssentialsXSpawn-2.22.1-dev+27-e70bdb8.jar
                https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar
                https://github.com/AuthMe/AuthMeReloaded/releases/download/6.0.1/AuthMe-6.0.1-Paper.jar
              MODRINTH_PROJECTS: |-
                fastasyncworldedit
                luckperms
                multiverse-core
                multiverse-signportals
                packetevents
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &javaPort 25565
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *javaPort
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *javaPort
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 4Gi
              limits:
                memory: 6Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          mc-router.itzg.me/externalServerName: fc.mc.eudald.gr
        ports:
          minecraft:
            port: *javaPort
      rcon:
        ports:
          rcon:
            port: 25575
      bedrock:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.1.42.157
          lbipam.cilium.io/sharing-key: minecraft
          external-dns.kubernetes.io/hostname: fc.mc.eudald.gr
          external-dns.kubernetes.io/target: 10.1.42.157
        ports:
          bedrock:
            port: 19132
            protocol: UDP
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      config-files:
        type: configMap
        name: minecraft-fc-configmap
        globalMounts:
          - path: /plugins/AuthMe/config.yml
            subPath: authme-config.yml
            readOnly: true
          - path: /plugins/Geyser-Spigot/config.yml
            subPath: geyser-config.yml
            readOnly: true
          - path: /plugins/LuckPerms/config.yml
            subPath: luckperms-config.yml
            readOnly: true
          - path: /plugins/LuckPerms/yaml-storage/groups/admin.yml
            subPath: luckperms-group-admin.yml
            readOnly: true
          - path: /plugins/LuckPerms/yaml-storage/groups/default.yml
            subPath: luckperms-group-default.yml
            readOnly: true
          - path: /config/paper-world-defaults.yml
            subPath: paper-world-defaults.yml
            readOnly: true
