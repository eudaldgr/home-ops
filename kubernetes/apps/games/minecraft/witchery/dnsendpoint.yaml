---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: minecraft-witchery
spec:
  endpoints:
    # Public record → cadi (towonel edge): Minecraft has no HTTPRoute, so nothing else creates it
    - dnsName: witchery.mc.eudald.gr
      recordType: CNAME
      targets:
        - towonel.eudald.gr
