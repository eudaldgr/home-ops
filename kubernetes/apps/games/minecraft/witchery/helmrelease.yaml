---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-witchery
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft-witchery
  interval: 1h
  values:
    controllers:
      minecraft:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              # Forge 1.7.10 only runs on Java 8
              tag: 2026.9.2-java8@sha256:a23a59bc9bd520d2c1bae97225b8672771cf82c90073ea36dc18f18c199f325b
            env:
              TZ: Europe/Madrid
              EULA: "TRUE"
              TYPE: FORGE
              VERSION: 1.7.10
              FORGE_VERSION: 10.13.4.1614
              MEMORY: 4G
              USE_AIKAR_FLAGS: true
              SERVER_NAME: witchery
              MOTD: Witchery • BoP • HarvestCraft (1.7.10)
              # Only applies when the world is first generated
              LEVEL_TYPE: BIOMESOP
              MODE: survival
              DIFFICULTY: normal
              # Offline mode like fc, but no AuthMe on Forge: whitelist (offline UUIDs) + ForgeEssentials AuthLogin.
              # Both are written by the agent sidecar on behalf of mc-register
              ONLINE_MODE: false
              ENABLE_WHITELIST: true
              ENFORCE_WHITELIST: true
              # Offline UUID of eudaldgr (md5 "OfflinePlayer:<name>"): for 1.7.10 mc-image-helper ignores the
              # ":offline" suffix and stores the Mojang UUID, which never matches in offline mode
              OPS: 40c7bf28-61ce-3b6c-a03d-7a0571f708c9
              EXISTING_OPS_FILE: SYNCHRONIZE
              MAX_PLAYERS: 10
              PVP: true
              # Everyone can build at spawn (vanilla spawn protection only exempts OPs)
              SPAWN_PROTECTION: 0
              VIEW_DISTANCE: 10
              PLAYER_IDLE_TIMEOUT: 30
              ENABLE_STATUS: true
              # ForgeEssentials configs from git (/config) are copied over the ones in /data on every start
              COPY_CONFIG_DEST: /data/ForgeEssentials
              SYNC_SKIP_NEWER_IN_DESTINATION: false
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: &secret minecraft-witchery-secret
                    key: RCON_PASSWORD
              CF_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: CF_API_KEY
              # Pinned file IDs: most 1.7.10 files on CurseForge lack the Forge loader tag, so "latest" can't be resolved
              # Clients also need JourneyMap (client-only)
              # Numeric project IDs: the CurseForge search endpoint (slug lookup) is forbidden for this API key
              # 220318 biomes-o-plenty, 69673 witchery, 221857 pams-harvestcraft, 222213 codechickencore,
              # 222211 notenoughitems, 74735 forge-essentials
              CURSEFORGE_FILES: |-
                220318:2499612
                69673:2234410
                221857:2270206
                222213:3293859
                222211:2302312
                74735:8712260
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &javaPort 25565
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *javaPort
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *javaPort
                  periodSeconds: 10
                  failureThreshold: 90
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 4Gi
              limits:
                memory: 6Gi
          agent:
            image:
              repository: docker.io/library/python
              tag: 3.13.15-alpine3.24@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
            command: ["python", "-B", "/app/agent.py"]
            env:
              PYTHONUNBUFFERED: "1"
              PORT: &agentPort 8081
              AGENT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: RCON_PASSWORD
              FE_SALT:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: FE_SALT
            probes:
              liveness: &agentProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *agentPort
                  periodSeconds: 30
              readiness: *agentProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          mc-router.itzg.me/externalServerName: witchery.mc.eudald.gr
          # LAN record → mc-router (no Bedrock LoadBalancer to carry it, unlike fc)
          external-dns.kubernetes.io/hostname: witchery.mc.eudald.gr
          external-dns.kubernetes.io/target: 10.1.42.157
        ports:
          minecraft:
            port: *javaPort
      rcon:
        ports:
          rcon:
            port: 25575
      agent:
        ports:
          http:
            port: *agentPort
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      config:
        type: configMap
        name: minecraft-witchery-configmap
        advancedMounts:
          minecraft:
            app:
              - path: /config/main.cfg
                subPath: fe-main.cfg
                readOnly: true
            agent:
              - path: /app/agent.py
                subPath: agent.py
                readOnly: true
      secret:
        type: secret
        name: *secret
        advancedMounts:
          minecraft:
            app:
              - path: /config/AuthLogin.cfg
                subPath: AuthLogin.cfg
                readOnly: true
