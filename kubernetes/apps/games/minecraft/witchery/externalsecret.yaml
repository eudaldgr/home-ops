---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-witchery
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minecraft-witchery-secret
    template:
      data:
        CF_API_KEY: "{{ .CF_API_KEY }}"
        FE_SALT: "{{ .FE_SALT }}"
        RCON_PASSWORD: "{{ .RCON_PASSWORD }}"
        # ForgeEssentials auth: always on (offline mode), no self-registration; mc-register/agent create accounts.
        # Moving before /auth login is allowed: FE sends "Login required" on every blocked event, and blocking
        # movement spams it each tick; chat, commands, interaction, pickup and combat stay blocked until login.
        # Copied over /data/ForgeEssentials on every start, so the salt must live here (the agent hashes with it too)
        AuthLogin.cfg: |
          Auth {
              B:allowAutoLogin=false
              B:allowOfflineReg=false
              B:autoEnable=false
              B:canMoveWithoutLogin=true
              I:checkInterval=10
              S:encryptionAlgorithm=SHA1
              B:forceEnable=true
              S:salt={{ .FE_SALT }}
          }
  dataFrom:
    - extract:
        key: minecraft-witchery
