---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-register
spec:
  chartRef:
    kind: OCIRepository
    name: mc-register
  interval: 1h
  values:
    controllers:
      mc-register:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.13.15-alpine3.24@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
            command: ["python", "-B", "/app/app.py"]
            env:
              TZ: Europe/Madrid
              PYTHONUNBUFFERED: "1"
              PORT: &port 8080
              APP_ORIGIN: https://{{ .Release.Name }}.eudald.gr
              SERVERS: |-
                fc=minecraft-fc-rcon.games.svc.cluster.local:25575
              RCON_PASSWORD_FC:
                valueFrom:
                  secretKeyRef:
                    name: minecraft-fc-secret
                    key: RCON_PASSWORD
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.eudald.gr"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      app:
        type: configMap
        name: mc-register-configmap
        globalMounts:
          - path: /app/app.py
            subPath: app.py
            readOnly: true
