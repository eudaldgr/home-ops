---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-register
spec:
  components:
    - ../../../../components/sso
  interval: 1h
  path: ./kubernetes/apps/games/mc-register/app
  patches:
    - patch: |-
        - op: add
          path: /spec/logo/darkLogoUrl
          value: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/minecraft.webp
      target:
        kind: PocketIDOIDCClient
  postBuild:
    substitute:
      APP: mc-register
      SSO_LOGO: minecraft
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  wait: false
