---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
spec:
  chartRef:
    kind: OCIRepository
    name: romm
  interval: 1h
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
            env:
              TZ: Europe/Madrid
              ROMM_BASE_URL: https://romm.eudald.gr
              ROMM_PORT: &port 8080
              ROMM_SESSION_SECURE_COOKIE: true
              ROMM_DB_DRIVER: postgresql
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres-app"
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres-app"
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres-app"
                    key: dbname
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres-app"
                    key: user
              DB_PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres-app"
                    key: password
              # REDIS_HOST left unset: the image runs its own Valkey, persisted under /redis-data
              # Pocket ID only; who gets in is decided by the client's allowed groups
              DISABLE_USERPASS_LOGIN: true
              DISABLE_SETUP_WIZARD: true
              OIDC_ENABLED: true
              OIDC_PROVIDER: Pocket ID
              OIDC_SERVER_APPLICATION_URL: https://auth.eudald.gr
              OIDC_REDIRECT_URI: https://romm.eudald.gr/api/oauth/openid
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-oidc"
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-oidc"
                    key: client-secret
              # Pocket ID admins become RomM admins; everyone the client lets in is a regular user
              OIDC_CLAIM_ROLES: groups
              OIDC_ROLE_ADMIN: admins
              OIDC_ROLE_VIEWER: "*"
              # Keyless metadata sources
              HASHEOUS_API_ENABLED: true
              HLTB_API_ENABLED: true
              LAUNCHBOX_API_ENABLED: true
              PLAYMATCH_API_ENABLED: true
              ENABLE_RESCAN_ON_FILESYSTEM_CHANGE: true
              ENABLE_SCHEDULED_UPDATE_LAUNCHBOX_METADATA: true
              SCHEDULED_UPDATE_LAUNCHBOX_METADATA_CRON: "0 2 * * *"
              ENABLE_SCHEDULED_RESCAN: true
              SCHEDULED_RESCAN_CRON: "0 3 * * *"
              ENABLE_SCHEDULED_CONVERT_IMAGES_TO_WEBP: true
              SCHEDULED_CONVERT_IMAGES_TO_WEBP_CRON: "0 4 * * *"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  # Database migrations run before nginx starts listening
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.eudald.gr"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      # config/, assets/ (saves, states, screenshots) and resources/ (covers, metadata)
      config:
        type: configMap
        name: romm-config
        globalMounts:
          - path: /romm/config/config.yml
            subPath: config.yml
            readOnly: true
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /romm
          - path: /redis-data
            subPath: redis-data
      library:
        type: nfs
        server: ds920plus.lan.eudald.gr
        path: /volume1/data/media/games
        globalMounts:
          - path: /romm/library
      # envsubst renders the nginx templates here at startup
      nginx-conf:
        type: emptyDir
        globalMounts:
          - path: /etc/nginx/conf.d
      tmp:
        type: emptyDir
