---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bedrockconnect
spec:
  chartRef:
    kind: OCIRepository
    name: bedrockconnect
  interval: 1h
  values:
    controllers:
      bedrockconnect:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/pugmatt/bedrock-connect
              tag: 1.71.0@sha256:5ea1ffb1110789c9a804f6dc37d8ab2e5e6ab31e8d0d7de5fdf8bf148c044b94
            env:
              TZ: Europe/Madrid
              BC_CUSTOM_SERVERS: /data/custom_servers.json
              BC_DB_TYPE: none
              BC_FEATURED_SERVERS: false
              # Players are authenticated by Geyser + Floodgate on the game server
              BC_NOVERIFYUSERS: true
              BC_USER_SERVERS: true
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.1.42.158
        ports:
          bedrock:
            port: 19132
            protocol: UDP
    persistence:
      config:
        type: configMap
        name: bedrockconnect-configmap
        globalMounts:
          - path: /data/custom_servers.json
            subPath: custom_servers.json
            readOnly: true
      players:
        type: emptyDir
        globalMounts:
          - path: /docker/brc/players
