---
working_dir: ./docker/cadi
auto_discovery:
  enabled: true
  depth: 1
  delete: true
force_recreate: false
reconciliation:
  enabled: true
  interval: 3600
external_secrets:
  CADDY_ACME_EMAIL: op://docker/cadi/CADDY_ACME_EMAIL
  TOWONEL_INVITE_HASH_KEY: op://docker/cadi/TOWONEL_INVITE_HASH_KEY
  GATUS_PUSHOVER_KEY: op://docker/pushover/PUSHOVER_USER_KEY
  GATUS_PUSHOVER_TOKEN: op://docker/gatus/GATUS_PUSHOVER_TOKEN
  GATUS_REMOTE_STATUS_HOSTNAME: op://docker/gatus/HOME_STATUS_HOSTNAME
  GATUS_REMOTE_HEARTBEAT_TOKEN: op://docker/gatus/CADI_HOME_HEARTBEAT_TOKEN
---
name: doco-cd-updater
working_dir: ./docker/cadi/doco-cd
compose_files:
  - compose.updater.yaml
force_recreate: true
reconciliation:
  enabled: true
  interval: 3600
