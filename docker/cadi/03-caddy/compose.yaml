---
name: caddy
services:
  app:
    image: ghcr.io/bjw-s-labs/caddy-l4:2.11.9@sha256:2ca65102e513f59fa431f1eea31c30e089893407a30557f0c9b36c7006d4967b
    container_name: caddy-l4
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      VPS_LOCAL_HOSTS: >-
        twnl.eudald.gr
        towonel.eudald.gr
        cadi-doco-cd.eudald.gr
        cadi-gatus.eudald.gr
    ports:
      - 80:80
      - 443:443
    volumes:
      - etc:/config
      - var:/data
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    restart: unless-stopped
volumes:
  etc:
  var:
configs:
  caddyfile:
    file: ./Caddyfile
networks:
  default:
    name: edge
    external: true
