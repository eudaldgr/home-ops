---
name: doco-cd-updater
services:
  app:
    image: ghcr.io/kimdre/doco-cd:0.134.0@sha256:1d40f570403689c762c63009ade3d5d0dc24595bf40f9629a8ab3865e4ddb768
    container_name: doco-cd-updater
    environment:
      DEPLOY_CONFIG_BASE_DIR: ./docker/cadi
      HTTP_PORT: 8881
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://github.com/eudaldgr/home-ops.git
          reference: main
          interval: 3600
          target: updater
      SCHEDULER_ENABLED: "false"
      TZ: Europe/Madrid
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      - type: bind
        source: /opt/doco-cd
        target: /opt/doco-cd
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
volumes:
  data:
