---
name: garage
services:
  chown:
    image: ghcr.io/vegops/chown:latest
    container_name: garage_chown_1
    volumes:
      - ${S3_DATA_DIR}/garage:/chown
    command: "-R 65532:65532 /chown"
  app:
    image: ghcr.io/vegops/garage:2.3.0-r0@sha256:da845e3fd7995d992332e2cff107d5ef04d3ef8a5be693887d30665ee526c626
    container_name: garage_app_1
    user: 65532:65532
    command: ["server"]
    depends_on:
      chown:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "/usr/bin/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ${S3_DATA_DIR}/garage/etc:/garage/etc
      - ${S3_DATA_DIR}/garage/var:/garage/var
    ports:
      - 9000:3900
      - 9002:3903
    restart: unless-stopped
  webui:
    image: ghcr.io/vegops/garage-webui:1.1.0-r0@sha256:ad8dceb1dd9aed71f7bcefa502da3f2c25aaac98611428ae795ae031bdff1803
    container_name: garage_webui_1
    depends_on:
      app:
        condition: service_healthy
    environment:
      CONFIG_PATH: /tmp/missing.toml
      API_BASE_URL: http://app:3903
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN}
      S3_REGION: eu-south-0
      S3_ENDPOINT_URL: http://app:3900
    ports:
      - 9001:3909
    tmpfs:
      - /tmp
    restart: unless-stopped
